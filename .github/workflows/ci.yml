# make lint test on every branch and pull request, in the same Docker dev
# stack as on a developer machine. No secrets are used: the AI is mocked and
# mail is the local GreenMail server.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint
      - name: Start the dev stack
        run: make up
      - name: Test
        run: make test
      # V4-12: browser tests, one screenshot per app (desktop and phone).
      - name: End-to-end
        run: make test-e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/results/
          if-no-files-found: ignore
          retention-days: 14
      # The Google Messages sidecar (Go): vet and tests, in the pinned Go image.
      - name: Messages sidecar
        run: docker run --rm -v "$PWD/services/gmessages:/src" -w /src golang:1.27.2-alpine sh -c 'go vet ./... && go test ./...'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
