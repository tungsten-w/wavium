# Wavium pins its dependencies on purpose (AGENTS.md, rule A6): only the
# GitHub Actions used by CI are bumped automatically, once a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
