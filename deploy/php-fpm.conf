; Atrium: PHP-FPM behind the Bun web server in the same container.
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Long DAV uploads/downloads.
request_terminate_timeout = 3600
; Nextcloud reads its environment (POSTGRES_*, REDIS_HOST, OVERWRITE*, ...).
clear_env = no
