# Wavium: a generic production stack for a fresh install (PLAN P6-1).
#
#   cp .env.example .env      # set WAVIUM_DOMAIN and the passwords
#   docker compose up -d      # first start installs Wavium (a few minutes)
#
# Caddy terminates HTTPS with an automatic certificate for WAVIUM_DOMAIN (Let's
# Encrypt; "localhost" gets Caddy's own local CA). Everything else stays on a
# private network. Data lives in named volumes (see `docker volume ls`).
# This is NOT the stack of an existing install (../compose.yaml): that one
# takes over a live Nextcloud. See README.md here.
name: ${WAVIUM_PROJECT:-wavium}

x-app: &app
  image: ${WAVIUM_IMAGE:-atrium:local}
  restart: unless-stopped
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_DB: wavium
    POSTGRES_USER: wavium
    POSTGRES_PASSWORD: ${WAVIUM_DB_PASSWORD:?set WAVIUM_DB_PASSWORD in .env}
    REDIS_HOST: redis
    NEXTCLOUD_ADMIN_USER: ${WAVIUM_ADMIN_USER:-admin}
    NEXTCLOUD_ADMIN_PASSWORD: ${WAVIUM_ADMIN_PASSWORD:?set WAVIUM_ADMIN_PASSWORD in .env}
    NEXTCLOUD_TRUSTED_DOMAINS: ${WAVIUM_DOMAIN:?set WAVIUM_DOMAIN in .env}
    # Caddy is the only proxy, and the edge network it sits on is the only
    # place a forwarded header can legitimately come from, so trust exactly
    # that subnet (frozen at the bottom of this file). Wider ranges are not
    # harmless: 192.168.0.0/16 and 10.0.0.0/8 cover the home network, so any
    # machine on the LAN reaching the published port could set
    # X-Forwarded-For and have Nextcloud believe it -- brute-force protection
    # and rate limits then count against a made-up address, and the log shows
    # it too.
    TRUSTED_PROXIES: ${WAVIUM_EDGE_SUBNET:-172.16.240.0/24}
    OVERWRITEHOST: ${WAVIUM_DOMAIN}${WAVIUM_PUBLIC_PORT_SUFFIX:-}
    OVERWRITEPROTOCOL: https
    OVERWRITECLIURL: https://${WAVIUM_DOMAIN}${WAVIUM_PUBLIC_PORT_SUFFIX:-}
    PHP_MEMORY_LIMIT: ${WAVIUM_PHP_MEMORY:-512M}
    PHP_UPLOAD_LIMIT: ${WAVIUM_UPLOAD_LIMIT:-10G}
    # Mail triage: PHP asks the Bun server over the network, by service name.
    # Not 127.0.0.1: this block is shared with the cron service, where nothing
    # listens on port 80, and the triage worker runs there. Loopback made every
    # classification fail with "AI unreachable: cURL error 7" while the status
    # page still showed the pipeline as on. From the app container the name
    # resolves to itself, so one value is right for both.
    ATRIUM_SERVER_URL: http://app:80
    ATRIUM_NTFY_URL: ${WAVIUM_NTFY_URL:-}
    ATRIUM_NTFY_TOKEN: ${WAVIUM_NTFY_TOKEN:-}
    ATRIUM_WEBHOOK_ALLOW: ${WAVIUM_WEBHOOK_ALLOW:-}
    TZ: ${WAVIUM_TIMEZONE:-Europe/Paris}
    # Settings > Your data: where the data lives on this machine.
    ATRIUM_HOST_DATA: ${WAVIUM_HOST_DATA:-volume:${WAVIUM_PROJECT:-wavium}_html/data}
    ATRIUM_HOST_DB: ${WAVIUM_HOST_DB:-volume:${WAVIUM_PROJECT:-wavium}_db}
    # Messages (ADR 0010): on with `--profile messages` and WAVIUM_GMESSAGES_SECRET.
    ATRIUM_GMESSAGES_URL: ${WAVIUM_GMESSAGES_URL:-http://gmessages:8765}
    ATRIUM_GMESSAGES_SECRET: ${WAVIUM_GMESSAGES_SECRET:-}
  volumes:
    - html:/var/www/html
    # Runs once after the first install: apps, cron, caches (official image hook).
    - ./hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
  networks: [backend]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *app
    cpus: ${WAVIUM_APP_CPUS:-2.0}
    mem_limit: ${WAVIUM_APP_MEM:-2g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/status.php"]
      interval: 15s
      start_period: 900s
      retries: 4
    networks: [backend, edge]

  # Background jobs (mail sync, triage, cleanup), every 5 minutes.
  cron:
    <<: *app
    entrypoint: /cron.sh
    cpus: ${WAVIUM_CRON_CPUS:-1.0}
    mem_limit: ${WAVIUM_CRON_MEM:-1g}
    environment:
      <<: *app-env
      NEXTCLOUD_ADMIN_USER: ""
      NEXTCLOUD_ADMIN_PASSWORD: ""
    depends_on:
      app: { condition: service_healthy }
    # Mail sync needs the internet.
    networks: [backend, edge]

  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wavium
      POSTGRES_USER: wavium
      POSTGRES_PASSWORD: ${WAVIUM_DB_PASSWORD:?set WAVIUM_DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavium -d wavium"]
      interval: 10s
      retries: 10
    cpus: ${WAVIUM_DB_CPUS:-1.5}
    mem_limit: ${WAVIUM_DB_MEM:-1g}
    networks: [backend]

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    mem_limit: 256m
    networks: [backend]

  # Google Messages link (services/gmessages), off unless `--profile messages`.
  # Reaches Google (edge network) and only the app (backend); never published.
  gmessages:
    build: ../../services/gmessages
    image: wavium-gmessages:local
    profiles: [messages]
    restart: unless-stopped
    environment:
      # 32+ characters (install.sh writes one); the service refuses to start without it.
      GMESSAGES_SECRET: ${WAVIUM_GMESSAGES_SECRET:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [backend, edge]

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      WAVIUM_DOMAIN: ${WAVIUM_DOMAIN}
      # "internal" for a local-network install (IP or no public DNS): Caddy's
      # own CA. Default "acme" = Let's Encrypt. See Caddyfile.
      WAVIUM_TLS_ISSUER: ${WAVIUM_TLS_ISSUER:-acme}
      # Caddy listens on these and builds its redirects from them, so the
      # published port and the container port must be the same number.
      WAVIUM_HTTP_PORT: ${WAVIUM_HTTP_PORT:-80}
      WAVIUM_HTTPS_PORT: ${WAVIUM_HTTPS_PORT:-443}
      WAVIUM_PUBLIC_PORT_SUFFIX: ${WAVIUM_PUBLIC_PORT_SUFFIX:-}
    ports:
      - "${WAVIUM_BIND:-0.0.0.0}:${WAVIUM_HTTP_PORT:-80}:${WAVIUM_HTTP_PORT:-80}"
      - "${WAVIUM_BIND:-0.0.0.0}:${WAVIUM_HTTPS_PORT:-443}:${WAVIUM_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]

networks:
  backend:
    internal: true
  edge:
    # Frozen: TRUSTED_PROXIES names this subnet. Left to itself Docker picks a
    # free range at creation time, which changes when the network is recreated
    # -- the app would then stop recognising Caddy and log the proxy's address
    # instead of the visitor's. Override WAVIUM_EDGE_SUBNET if the default
    # collides with another network on the host (`docker network ls`).
    ipam:
      config:
        - subnet: ${WAVIUM_EDGE_SUBNET:-172.16.240.0/24}

volumes:
  html: {}
  db: {}
  redis: {}
  caddy-data: {}
  caddy-config: {}
