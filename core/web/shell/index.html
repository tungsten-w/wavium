<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wavium</title>
<link rel="icon" href="/core/img/favicon.ico" sizes="any">
<link rel="icon" href="/core/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/core/img/favicon-touch.png">
<meta name="theme-color" content="#0b6aa8">
<link rel="manifest" href="/core/img/manifest.json" crossorigin="use-credentials">
<link rel="stylesheet" href="/core/web/dist/ui.css?v=__V__">
<link rel="stylesheet" href="/core/web/dist/shell.css?v=__V__">
<script>try{var t=localStorage.getItem('atrium.theme');if(t&&t!=='system')document.documentElement.dataset.theme=t;var d=document.documentElement,c=localStorage.getItem('atrium.seed');if(c)d.style.setProperty('--at-seed',c);var w=JSON.parse(localStorage.getItem('atrium.wp')||'null');if(w){if(w.g)d.classList.add('at-wallpaper-atrium');if(w.u){d.classList.add('at-has-wallpaper');d.style.setProperty('--at-wallpaper','url("'+w.u+'")')}}}catch(e){}</script>
<!--importmap-->
<script type="module" src="/core/web/dist/shell.js?v=__V__"></script>
</head>
<body>
<div id="atrium"><div class="shell-boot"><span class="at-spinner"></span></div></div>
<noscript>Wavium needs JavaScript.</noscript>
</body>
</html>
